name: Catacombs CI/CD
on:
  push:
    branches: [master]
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Gitea registry
        run: echo "${{ secrets.PACKAGE_TOKEN }}" | docker login git.tolelom.xyz -u tolelom --password-stdin
      - name: Build image
        run: docker build -t git.tolelom.xyz/tolelom/catacombs:main -t git.tolelom.xyz/tolelom/catacombs:${{ github.sha }} .
      - name: Push main tag
        run: docker push git.tolelom.xyz/tolelom/catacombs:main
      - name: Push sha tag
        run: docker push git.tolelom.xyz/tolelom/catacombs:${{ github.sha }}
